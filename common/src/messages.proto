syntax = "proto3";

// Messages from Webapp -> Orchestrator (PUSH)
message OrchestratorCommand {
    enum CommandType {
        PING = 0;
        GENERATE_TASKS = 1;
    }
    CommandType type = 1;
    string vault_path = 2; // Required for GENERATE_TASKS
}

// Messages from Orchestrator -> Webapp (PUSH)
message OrchestratorStatus {
    enum StatusType {
        UNKNOWN = 0;
        IDLE = 1;
        PROCESSING = 2;
    }
    bool is_alive = 1;
    StatusType current_status = 2; // e.g., IDLE, PROCESSING
}
